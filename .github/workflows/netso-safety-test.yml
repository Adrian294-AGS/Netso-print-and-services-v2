name: NETSO safety test

on:
  workflow_dispatch:

jobs:
  missing-artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Check the missing-artwork warning
        env:
          ORDER_URL: ${{ vars.NETSO_TEST_ORDER_URL }}
          ORDER_ID: ${{ vars.NETSO_TEST_ORDER_ID }}
          EXPECTED_WARNING: ${{ vars.NETSO_ARTWORK_WARNING }}
          STAFF_STATE: ${{ secrets.NETSO_STAFF_STORAGE_STATE }}
        run: |
          cat > netso-safety.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          function requiredSetting(name) {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`Missing GitHub setting: ${name}`);
            return value;
          }

          test.use({
            storageState: JSON.parse(requiredSetting('STAFF_STATE')),
          });

          test('NETSO warns staff when a test order has no artwork', async ({ page }) => {
            await page.goto(requiredSetting('ORDER_URL'));
            await page.getByText('Service Requests', { exact: true }).click();
            await expect(page.getByRole('heading', { name: 'Order Management' })).toBeVisible();

            const row = page.getByRole('row').filter({
              has: page.getByText(requiredSetting('ORDER_ID'), { exact: true }),
            });

            await expect(row.getByText('No file attached', { exact: true })).toBeVisible();
            await row.getByRole('button', { name: 'View', exact: true }).click();

            await expect(
              page.getByRole('heading', { name: 'Request Details & Management' }),
            ).toBeVisible();

            await expect(
              page.getByText(requiredSetting('EXPECTED_WARNING'), { exact: true }),
            ).toBeVisible();
          });
          EOF

          npx playwright test netso-safety.spec.cjs --workers=1
